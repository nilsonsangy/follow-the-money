[project]
name = "follow-the-money"
version = "0.1.0"
description = "Cryptocurrency address detection, balance lookup, transaction tracing and pattern analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "httpx",
]

[project.scripts]
ftm = "follow_the_money.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
